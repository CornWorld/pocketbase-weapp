name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # npm provenance 需要 OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-and-publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }} # secrets 不能用于 if,经 env 中转
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "检出同级 mp-web-polyfill(link: 依赖目标,公开仓库免 token)"
        uses: actions/checkout@v4
        with:
          repository: CornWorld/mp-web-polyfill
          path: mp-web-polyfill
      - name: "移到 package.json link: 期望的兄弟路径"
        run: mv mp-web-polyfill ../mp-web-polyfill

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: Changesets(版本 PR / 发布)
        if: env.HAS_NPM_TOKEN == 'true' # 未配置 npm 凭据前整段跳过,防止误发 link: 依赖的包
        id: changesets
        uses: changesets/action@v1
        with:
          version: "pnpm changeset:version"
          publish: "pnpm changeset:publish"
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true # provenance 由 npm 配置开关承担,changeset publish 无 --provenance flag

      - name: 归档已发布 tarball
        if: steps.changesets.outputs.published == 'true'
        run: |
          npm pack
          mkdir -p dist-artifacts
          mv *.tgz dist-artifacts/

      - uses: actions/upload-artifact@v4
        if: steps.changesets.outputs.published == 'true'
        with:
          name: published-tarball-${{ github.sha }}
          path: dist-artifacts/
          retention-days: 90
          if-no-files-found: error
